name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx vite build      # génère routeTree.gen.ts puis compile
        env:
          VITE_API_URL: https://backforum.instapoint.site/api
      - run: npx tsc -b          # typecheck complet
      - run: npm test           # logique du compte à rebours
